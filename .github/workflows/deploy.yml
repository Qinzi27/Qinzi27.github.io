name: Deploy Quartz site to GitHub Pages
run-name: Deploy Quartz site · ${{ inputs.calendar_ref || github.sha }} · ${{ inputs.request_id || github.run_id }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      calendar_ref:
        description: "Private calendar commit SHA (defaults to main)"
        required: false
        default: "main"
        type: string
      request_id:
        description: "Unique GUI dispatch identifier"
        required: false
        default: ""
        type: string

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate private calendar ref
        env:
          CALENDAR_REF: ${{ inputs.calendar_ref || 'main' }}
          REQUEST_ID: ${{ inputs.request_id || '' }}
        shell: bash
        run: |
          if [[ "$CALENDAR_REF" != "main" && ! "$CALENDAR_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "calendar_ref must be main or a 40-character lowercase commit SHA." >&2
            exit 1
          fi
          if [[ -n "$REQUEST_ID" && ! "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,80}$ ]]; then
            echo "request_id contains unsupported characters or is longer than 80 characters." >&2
            exit 1
          fi
      - name: Checkout private calendar content
        uses: actions/checkout@v6
        with:
          repository: Qinzi27/Qinzi27-calendar-content
          ref: ${{ inputs.calendar_ref || 'main' }}
          path: _local/calendar-content
          ssh-key: ${{ secrets.CALENDAR_CONTENT_READ_KEY }}
          ssh-strict: true
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            calendar/daily-log.md
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build Quartz
        env:
          PARENT_CALENDAR_PASSWORD: ${{ secrets.PARENT_CALENDAR_PASSWORD }}
          CALENDAR_ACCESS_TOKEN: ${{ secrets.CALENDAR_ACCESS_TOKEN }}
          CALENDAR_PRIVATE_REPO_DIR: ${{ github.workspace }}/_local/calendar-content
          CALENDAR_LOG_PATH: ${{ github.workspace }}/_local/calendar-content/calendar/daily-log.md
          PUBLIC_INTERACTIONS_API_URL: https://qinzi27-interactions.qinzi27.workers.dev
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
